<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#glow)" opacity="0.6"/>

  <!-- thin grid, restrained -->
  <g stroke="#141414" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- brand -->
  <g transform="translate(72, 66)">
    <rect width="22" height="22" rx="5" fill="#ffffff"/>
    <rect x="7" y="7" width="8" height="8" rx="2" fill="#000000"/>
    <text x="38" y="17" font-family="Inter, -apple-system, Segoe UI, sans-serif"
          font-size="21" font-weight="600" fill="#ffffff">laya<tspan fill="#666666" font-weight="400">npu</tspan></text>
  </g>

  <!-- headline -->
  <text x="72" y="248" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="62" font-weight="600" fill="#ffffff" letter-spacing="-2.2">
    The NPU in your laptop,
  </text>
  <text x="72" y="318" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="62" font-weight="600" fill="#ffffff" letter-spacing="-2.2">
    actually doing something.
  </text>

  <text x="72" y="372" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="23" fill="#9a9a9a">
    Typed decisions in 29 ms. Speech to text at 57x realtime. No cloud, no API keys.
  </text>

  <!-- metrics -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(72, 428)">
      <text font-size="44" font-weight="600" fill="#ffffff">29 ms</text>
      <text y="26" font-size="14" fill="#666666" font-family="Inter, sans-serif">per decision</text>
    </g>
    <g transform="translate(280, 428)">
      <text font-size="44" font-weight="600" fill="#ffffff">57x</text>
      <text y="26" font-size="14" fill="#666666" font-family="Inter, sans-serif">realtime audio</text>
    </g>
    <g transform="translate(488, 428)">
      <text font-size="44" font-weight="600" fill="#ffffff">85 MB</text>
      <text y="26" font-size="14" fill="#666666" font-family="Inter, sans-serif">whisper model</text>
    </g>
    <g transform="translate(724, 428)">
      <text font-size="44" font-weight="600" fill="#ffffff">$0</text>
      <text y="26" font-size="14" fill="#666666" font-family="Inter, sans-serif">per request</text>
    </g>
  </g>

  <!-- right: probability bars, echoing the product -->
  <g transform="translate(900, 150)">
    <text font-family="Inter, sans-serif" font-size="13" fill="#666666" letter-spacing="1.4">DECISION</text>
    <g transform="translate(0, 26)">
      <text y="0" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" font-weight="600">billing</text>
      <rect y="10" width="180" height="5" rx="2.5" fill="#1e1e1e"/>
      <rect y="10" width="171" height="5" rx="2.5" fill="#ffffff"/>
      <text x="200" y="16" font-family="ui-monospace, monospace" font-size="12" fill="#666666">0.95</text>
    </g>
    <g transform="translate(0, 66)">
      <text y="0" font-family="Inter, sans-serif" font-size="15" fill="#9a9a9a">technical</text>
      <rect y="10" width="180" height="5" rx="2.5" fill="#1e1e1e"/>
      <rect y="10" width="25" height="5" rx="2.5" fill="#4a4a4a"/>
      <text x="200" y="16" font-family="ui-monospace, monospace" font-size="12" fill="#666666">0.03</text>
    </g>
    <g transform="translate(0, 106)">
      <text y="0" font-family="Inter, sans-serif" font-size="15" fill="#9a9a9a">other</text>
      <rect y="10" width="180" height="5" rx="2.5" fill="#1e1e1e"/>
      <rect y="10" width="16" height="5" rx="2.5" fill="#4a4a4a"/>
      <text x="200" y="16" font-family="ui-monospace, monospace" font-size="12" fill="#666666">0.02</text>
    </g>
  </g>

  <!-- bottom row -->
  <line x1="72" y1="560" x2="1128" y2="560" stroke="#1e1e1e"/>
  <text x="72" y="592" font-family="ui-monospace, monospace" font-size="14" fill="#666666">
    Apache-2.0 · OpenVINO · Intel Core Ultra
  </text>
  <text x="1128" y="592" text-anchor="end" font-family="ui-monospace, monospace"
        font-size="14" fill="#9a9a9a">laya.manef.dev</text>
</svg>
