name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project has a narrow purpose: local decisions and local speech on Intel NPU
        hardware, with no cloud fallback. Features that add a cloud dependency, or that
        ask the model to choose an action, will be declined. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: dropdown
    id: offline
    attributes:
      label: Does this work fully offline?
      options: ["Yes", "No", "Not sure"]
    validations: { required: true }
